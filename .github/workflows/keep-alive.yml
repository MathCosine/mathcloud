# Pings the Supabase project every few days so the free plan never pauses it
# for inactivity (it pauses after 7 days with no requests). Each ping is one
# tiny read: the id of one contest. Costs nothing measurable.
#
# Reads the same variables as the site: SUPABASE_URL and SUPABASE_ANON_KEY.
# Run it by hand from the Actions tab to check it works ("Keep Supabase awake").
#
# GitHub turns off scheduled workflows in a repository with no commits for 60
# days; it emails a warning first, and one click on "Enable workflow" (or any
# commit) turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'   # 09:17 UTC every third day
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY is not set (Settings, Secrets and variables, Actions, Variables). Nothing to ping."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$URL/rest/v1/contests?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$code" = "200" ]; then echo "Supabase answered (HTTP 200): awake."; exit 0; fi
            echo "Attempt $attempt: HTTP $code $(head -c 200 /tmp/body)"
            sleep $((attempt * 20))
          done
          echo "::error::Supabase did not answer. If the project is paused, restore it from the Supabase dashboard."
          exit 1
